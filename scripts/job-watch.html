<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video job watch (development)</title>
<style>
  :root { --bg:#f7f6f2; --fg:#1c2230; --muted:#667085; --card:#fff; --line:#dedbd0; --ok:#1f7a3e; --run:#1d63c9; --bad:#c42b22; --skip:#8a8f9c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --fg:#e7e9f0; --muted:#9aa1b5; --card:#1a1f2a; --line:#2a3040; --ok:#6cc58a; --run:#6aa5ff; --bad:#ff7b72; --skip:#7c8294; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, Segoe UI, sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header b { font-size:16px; } header span { color:var(--muted); }
  main { display:grid; grid-template-columns:minmax(240px,320px) 1fr; gap:16px; padding:16px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; min-width:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  select, input, button { font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); max-width:100%; }
  button { cursor:pointer; background:var(--run); color:#fff; border-color:var(--run); } button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0; align-items:center; }
  .job { padding:8px; border-radius:8px; cursor:pointer; border:1px solid transparent; } .job:hover, .job.sel { border-color:var(--line); background:var(--bg); }
  .pill { font-size:11px; font-weight:700; padding:1px 8px; border-radius:99px; color:#fff; } .done { background:var(--ok); } .running { background:var(--run); } .failed { background:var(--bad); } .cancelled, .skipped { background:var(--skip); }
  .stage { display:grid; grid-template-columns:90px 1fr 80px; gap:8px; align-items:center; margin:6px 0; }
  .bar { height:16px; background:var(--bg); border-radius:4px; overflow:hidden; border:1px solid var(--line); } .bar i { display:block; height:100%; background:var(--ok); min-width:2px; } .bar i.running { background:var(--run); animation:pulse 1s infinite; } .bar i.failed { background:var(--bad); }
  @keyframes pulse { 50% { opacity:.55; } }
  .t { text-align:right; font-variant-numeric:tabular-nums; } .muted { color:var(--muted); font-size:13px; }
  pre { background:var(--bg); padding:8px; border-radius:6px; overflow:auto; font-size:12px; max-height:240px; }
  video { width:100%; max-height:70vh; background:#000; border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:13px; } td { padding:3px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
</style>
</head>
<body>
<header><b>Video job watch</b><span>development only, 127.0.0.1</span></header>
<main>
  <section>
    <div class="card">
      <h2>Start a job</h2>
      <div class="row"><select id="topic" style="width:100%"></select></div>
      <div class="row"><input id="q" placeholder="or type a topic, then Find" style="flex:1;min-width:0"><button id="find" type="button">Find</button></div>
      <div class="row"><label>frames a second <input id="fps" type="number" value="12" min="6" max="30" style="width:64px"></label><button id="go" type="button">Start</button></div>
      <div id="msg" class="muted"></div>
    </div>
    <div class="card"><h2>Jobs</h2><div id="jobs" class="muted">none yet</div></div>
  </section>
  <section id="detail"><div class="card muted">Start a job or pick one.</div></section>
</main>
<script>
var sel = null, topics = [];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmt(ms){ if (ms == null) return ''; var s = ms/1000; return s < 90 ? s.toFixed(1)+' s' : Math.floor(s/60)+' m '+Math.round(s%60)+' s'; }
function get(u){ return fetch(u, {cache:'no-store'}).then(function(r){ return r.json(); }); }
get('/api/topics').then(function(l){ topics = l; $('topic').innerHTML = l.map(function(t){ return '<option value="'+esc(t.id)+'">'+esc(t.board+' class '+t.grade+' '+t.subject+': '+t.topic)+(t.lessonReady?'':' (no lesson yet)')+'</option>'; }).join(''); });
$('find').onclick = function(){ get('/api/match?q='+encodeURIComponent($('q').value)).then(function(r){ if (r.error) { $('msg').textContent = r.error; return; } $('topic').value = r.id; $('msg').textContent = 'matched: '+r.topic; }); };
$('go').onclick = function(){
  $('go').disabled = true;
  fetch('/api/start', {method:'POST', body:JSON.stringify({nodeId:$('topic').value, fps:Number($('fps').value)})}).then(function(r){ return r.json(); }).then(function(r){
    $('go').disabled = false; if (r.error) { $('msg').textContent = r.error; return; } $('msg').textContent = 'started '+r.id; sel = r.id; tick();
  });
};
function stages(events, now, finished){
  var order = ['request','retrieve','ground','build','render','qa'], out = [], by = {};
  events.forEach(function(e){ if (e.stage === 'job') return; var s = by[e.stage] || (by[e.stage] = {}); if (e.status === 'started') s.start = Date.parse(e.t); else { s.end = Date.parse(e.t); s.status = e.status; s.detail = e.detail; } });
  order.forEach(function(n){ var s = by[n]; if (!s) { out.push({name:n, status:'waiting'}); return; } var running = s.start && !s.end && !finished;
    out.push({name:n, status: running ? 'running' : (s.status || 'cancelled'), ms: s.start && s.end ? s.end - s.start : (running ? now - s.start : null), detail: s.detail}); });
  return out;
}
function show(d){
  var ev = d.events, now = Date.parse(d.now), first = ev.length ? Date.parse(ev[0].t) : now;
  var finished = !!d.result, last = ev.length ? Date.parse(ev[ev.length-1].t) : now;
  var st = stages(ev, now, finished), max = Math.max.apply(null, st.map(function(s){ return s.ms || 0; }).concat([1000]));
  var status = d.result ? d.result.status : 'running';
  var h = '<div class="card"><h2>'+esc(d.id)+' <span class="pill '+status+'">'+status+'</span></h2>'
    + '<div class="muted">total '+fmt((finished ? last : now) - first)+(d.result && d.result.code ? ' &middot; '+esc(d.result.code)+': '+esc(d.result.detail||'') : '')+'</div>';
  st.forEach(function(s){ h += '<div class="stage"><span>'+s.name+'</span><div><div class="bar"><i class="'+(s.status==='running'?'running':s.status==='failed'?'failed':'')+'" style="width:'+Math.max(1, (s.ms||0)/max*100)+'%"></i></div>'+(s.detail?'<div class="muted">'+esc(s.detail)+'</div>':'')+'</div><span class="t">'+(s.status==='waiting'?'waiting':s.status==='skipped'?'skipped':fmt(s.ms))+'</span></div>'; });
  h += '</div>';
  if (d.qa) h += '<div class="card"><h2>Delivery checks</h2><table>'+d.qa.map(function(c){ return '<tr><td><span class="pill '+(c.ok?'done':'failed')+'">'+(c.ok?'ok':'fail')+'</span></td><td>'+esc(c.id)+'</td><td>'+esc(c.message)+'</td></tr>'; }).join('')+'</table></div>';
  if (status === 'done') h += '<div class="card"><h2>Video</h2><video controls src="/api/job/'+encodeURIComponent(d.id)+'/video"></video></div>';
  if (d.sources) { var s = d.sources, b = s.book;
    h += '<div class="card"><h2>Sources</h2>'+(b ? '<p><b>'+esc(b.title)+'</b>, '+esc(b.edition)+'<br>chapter '+esc(b.chapter)+' '+esc(b.chapterTitle)+', section '+esc(b.section)+' '+esc(b.sectionTitle)+'<br>printed pages '+esc(b.printedPages && b.printedPages.join(' to '))+' (confirmed by a person: '+b.pageRangeConfirmedByPerson+')</p>' : '<p>no book section</p>')
      + '<table>'+s.claims.map(function(c){ return '<tr><td>tier '+esc(c.tier)+'</td><td>'+esc(c.id)+'</td><td>'+esc(c.statement)+'</td></tr>'; }).join('')+'</table>'
      + '<h2 style="margin-top:10px">Caveats</h2><ul>'+s.caveats.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('')+'</ul></div>'; }
  h += '<div class="card"><h2>Events</h2><pre>'+esc(ev.map(function(e){ return e.t.slice(11,23)+'  '+e.stage+' '+e.status+(e.detail?'  '+e.detail:'')+(e.code?'  ['+e.code+']':''); }).join('\n'))+'</pre></div>';
  var keep = document.querySelector('#detail video'), t = keep ? keep.currentTime : 0, paused = keep ? keep.paused : true;
  if (keep && status === 'done' && sel === $('detail').dataset.id && $('detail').dataset.done === '1') return; // do not rebuild the page under a playing video
  $('detail').innerHTML = h; $('detail').dataset.id = d.id; $('detail').dataset.done = status === 'done' ? '1' : '0';
}
function tick(){
  get('/api/jobs').then(function(rows){
    $('jobs').innerHTML = rows.length ? rows.map(function(r){ return '<div class="job '+(r.id===sel?'sel':'')+'" data-id="'+esc(r.id)+'"><b>'+esc(r.id)+'</b> <span class="pill '+r.status+'">'+r.status+'</span><div class="muted">'+esc((r.startedAt||'').slice(11,19))+(r.code?' &middot; '+esc(r.code):'')+'</div></div>'; }).join('') : 'none yet';
    Array.prototype.forEach.call(document.querySelectorAll('.job'), function(el){ el.onclick = function(){ sel = el.dataset.id; $('detail').dataset.done = '0'; tick(); }; });
    if (!sel && rows[0]) sel = rows[0].id;
    if (sel) get('/api/job/'+encodeURIComponent(sel)).then(show);
  });
}
setInterval(tick, 1000); tick();
</script>
</body>
</html>
